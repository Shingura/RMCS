rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::ArmPinocchioTest -> arm_test_hardware
      - rmcs_core::controller::arm::ArmConfig -> arm_config
      - rmcs_core::controller::arm::ArmTestController -> arm_test_controller
      - rmcs_core::controller::arm::ArmSolver -> arm_solver

arm_test_hardware:
  ros__parameters:
    connect_hardware: true
    feedback_timeout_ms: 100
    # Copied from lunar_rover_engineer; replace the serial and zero points for the bench arm.
    # The board is now an RMCS Board Lite, so this string must be replaced by that board's serial.
    board_serial_arm_board: "D4-D354-B7C8-A457-ECB1-11A9-998E"
    # CAN wiring on that board:
    #   kCan0: joint 1..3 (0x141, 0x142, 0x143)
    #   kCan1: joint 4..6 (0x144, 0x145, 0x141)
    #   kCan2: joint 2 absolute encoder (0x200)
    joint1_zero_point: 14669
    joint2_zero_point: 39433
    joint3_zero_point: 29072
    joint4_zero_point: 33493
    joint5_zero_point: 60137
    joint6_zero_point: 12793

arm_solver:
  ros__parameters:
    # controller_list: [pid, gravity, friction]
    controller_list: [gravity_pinocchio]
    joint_6_angle_kp: 120.0
    joint_6_angle_ki: 0.0
    joint_6_angle_kd: 0.04
    joint_6_vel_kp: 0.0908
    joint_6_vel_ki: 0.0
    joint_6_vel_kd: 0.030
    # The solver prints the total torque command once per second (see update()).
